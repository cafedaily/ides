version: "1.1"
project: yang-xiangfa
description: "养想法——把零散念头养成有结构的想法"

modules:
  backend:
    path: yang/
    responsibility: "中文分词、实体归并、TF-IDF、图谱、HTTP API、LLM 代理"
    agent_role: backend-engineer
    write_scope:
      - "yang/"
    depends_on: []
    public_api:
      - "HTTP /api/* (13 路由 + LLM 代理)"
      - "python -m yang CLI"
    data_owned:
      - "yang.db (SQLite)"
    forbidden:
      - "修改 web/src/"
      - "引入第三方依赖"
      - "硬编码 API key"
    status: "🔧"

  frontend:
    path: web/
    responsibility: "单文件 Web 前端：UI、离线存储、智能体调用"
    agent_role: frontend-engineer
    write_scope:
      - "web/src/"
      - "web/build.py"
    depends_on:
      - backend
    public_api:
      - "浏览器 UI (web/index.html)"
    data_owned:
      - "IndexedDB (浏览器端)"
    forbidden:
      - "修改 yang/"
      - "引入 npm/node_modules"
      - "直接调用外部 API"
      - "在 localStorage 存模型配置"
    status: "🔧"

  tests:
    path: tests/
    responsibility: "单元测试、集成测试、跨语言对照"
    agent_role: qa-engineer
    write_scope:
      - "tests/"
    depends_on:
      - backend
    public_api: []
    data_owned: []
    forbidden:
      - "修改被测代码 (yang/, web/)"
      - "引入 mock 框架"
      - "依赖固定端口"
    status: "✅"

  build:
    path: "."
    responsibility: "Makefile、pyproject.toml、README、.structure/ 维护"
    agent_role: devops-engineer
    write_scope:
      - "Makefile"
      - "pyproject.toml"
      - "README.md"
      - ".structure/"
    depends_on: []
    public_api: []
    data_owned: []
    forbidden:
      - "修改 yang/、web/src/、tests/ 下的代码"
    status: "✅"

coupling:
  red_lines:
    - pair: ["yang/jsonl.py", "web/src/yangdata.js"]
      reason: "同构实现，改一个必须改另一个"
      guard: "tests/test_jsonl.py 跨语言对照"
    - pair: ["yang/api.py ROUTES", "web/src/03_api.js"]
      reason: "路由 ↔ 前端调用"
      guard: "tests/test_api.py"
    - pair: ["yang/text.py 字符集", "tests/test_text.py + tests/test_entity.py"]
      reason: "字符集穷举"
      guard: "make test"
